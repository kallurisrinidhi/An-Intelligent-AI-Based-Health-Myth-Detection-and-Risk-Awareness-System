<!DOCTYPE html>
<html>
<head>
    <title>AI Health Engine – Analytics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>📊 AI Health Engine – Analytics Dashboard</h1>

    <div class="result-box fact">
        <p><b>Total Beliefs Analyzed:</b> {{ total_queries }}</p>
        <p><b>MYTH Count:</b> {{ myth_count }}</p>
        <p><b>FACT Count:</b> {{ fact_count }}</p>
        <p><b>Average Confidence:</b> {{ avg_confidence }}%</p>
        <p><b>User Feedback – Correct:</b> {{ correct_count }}</p>
        <p><b>User Feedback – Incorrect:</b> {{ incorrect_count }}</p>
    </div>

    <br>
    <a href="/" style="text-decoration:none;">
        <button>⬅ Back to Analyzer</button>
    </a>
</div>

</body>
</html>
