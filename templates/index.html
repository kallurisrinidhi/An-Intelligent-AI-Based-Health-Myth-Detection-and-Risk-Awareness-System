<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TruthGuardAI</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#0f2027);
background-size:400% 400%;
animation:gradient 12s ease infinite;
color:white;
text-align:center;
}

@keyframes gradient{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.navbar{
display:flex;
justify-content:space-between;
padding:20px 60px;
}

.nav-links{
display:flex;
gap:20px;
}

.search-container{
margin-top:40px;
display:flex;
justify-content:center;
gap:10px;
}

input{
padding:12px;
width:500px;
border-radius:8px;
border:none;
}

.verify-btn{
background:#34ff9c;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

.fact{color:#66ff99}
.myth{color:#ff6b6b}
.uncertain{color:#ffd166}

button{
margin:5px;
padding:8px 15px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="navbar">
<div>TruthGuardAI</div>
<div class="nav-links">
<a href="/">Home</a>
<a href="/library">Library</a>
<a href="/about">About AI</a>
<a href="/analytics">Analytics</a>
<a href="/admin">Admin</a>
</div>
</div>

<h1>Separating Fact From Fiction</h1>

<form id="aiForm" class="search-container">
<input type="text" name="belief" placeholder="Ask health myth..." required>
<button class="verify-btn">Verify</button>
</form>

<div id="result"></div>

<script>

document.getElementById("aiForm").onsubmit = async function(e){
e.preventDefault();

const formData = new FormData(this);

const res = await fetch("/analyze",{
method:"POST",
body:formData
});

const data = await res.json();

document.getElementById("result").innerHTML =
`
<h2 class="${data.color}">${data.result}</h2>
<p>Confidence: ${data.confidence}%</p>
<p>Risk Score: ${data.risk_score}</p>
<p>${data.explanation}</p>

<div>
<button onclick="sendFeedback('Correct')">👍 Correct</button>
<button onclick="sendFeedback('Incorrect')">👎 Incorrect</button>
</div>
`;
}

function sendFeedback(type){

fetch("/feedback",{
method:"POST",
headers:{'Content-Type':'application/x-www-form-urlencoded'},
body:new URLSearchParams({
belief:document.querySelector("input[name='belief']").value,
ai_result:document.querySelector("#result h2").innerText,
confidence:document.querySelector("#result p").innerText.replace("Confidence: ","").replace("%",""),
feedback:type
})
})
.then(()=>alert("Feedback Saved"));
}

</script>

</body>
</html>
